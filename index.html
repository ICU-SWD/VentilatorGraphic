<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Ventilator Simulator (Advanced Clinical View)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* === UI แบบหน้าจอ Ventilator จริง (Dark Theme) === */
        body { font-family: 'Sarabun', sans-serif; background-color: #0d1117; text-align: center; padding: 20px; margin: 0; color: #c9d1d9; }
        .container { background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 10px 40px rgba(0,0,0,0.8); max-width: 1250px; margin: auto; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        .header-box { display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 20px; position: relative; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
        .hospital-logo { height: 60px; position: absolute; left: 10px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
        .header-title { color: #f0f6fc; margin: 0 0 5px 0; font-size: 24px; font-weight: 700; letter-spacing: 1px; }
        .subtitle { color: #8b949e; font-size: 14px; margin: 0; }

        .main-display { display: flex; flex-wrap: wrap; gap: 20px; width: 100%; justify-content: center; margin-bottom: 20px; }
        
        /* กล่องแสดงผลคนไข้ */
        .clinical-panel { background: #0d1117; border: 2px solid #30363d; border-radius: 10px; width: 320px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .clinical-title { font-weight: bold; color: #58a6ff; font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid #30363d; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        .bed-scene { position: relative; width: 100%; height: 200px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; border: 1px solid #21262d; }
        .patient-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transition: opacity 0.3s; }
        .vent-screen-light { position: absolute; left: 20px; bottom: 20px; width: 15px; height: 15px; background: #34495e; z-index: 2; border-radius: 50%; opacity: 0.9; }

        .status-box { background: #161b22; padding: 10px; border-radius: 6px; border: 1px solid #30363d; text-align: left; font-size: 14px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #000; letter-spacing: 0.5px; }
        
        /* กราฟ */
        canvas { background: #000; border-radius: 8px; border: 2px solid #30363d; width: 100%; max-width: 850px; box-shadow: inset 0 0 30px rgba(0,0,0,1); }
        
        /* แผงควบคุมพารามิเตอร์แบบ Digital */
        .control-panel { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; background: #0d1117; padding: 20px; border-radius: 8px; width: 100%; box-sizing: border-box; border: 2px solid #30363d; }
        .control-group { display: flex; flex-direction: column; align-items: center; margin: 5px; flex: 1 1 160px; background: #161b22; padding: 15px 10px; border-radius: 8px; border: 1px solid #21262d; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }
        
        label { font-size: 13px; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        
        /* ตัวเลข Digital เรืองแสง */
        .digital-value { font-size: 28px; font-weight: bold; color: #3fb950; font-family: monospace; text-shadow: 0 0 10px rgba(63,185,80,0.5); margin-bottom: 10px; line-height: 1; }
        
        select { padding: 8px; border-radius: 4px; border: 1px solid #30363d; font-family: 'Sarabun', sans-serif; width: 100%; font-size: 14px; background: #0d1117; color: #c9d1d9; outline: none; }
        select:focus { border-color: #58a6ff; }
        
        /* ตกแต่ง Slider ให้ดูล้ำขึ้น */
        input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #58a6ff; cursor: pointer; margin-top: -8px; box-shadow: 0 0 10px rgba(88,166,255,0.8); }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #30363d; border-radius: 2px; }
        
        .btn-capture { background-color: #238636; color: white; cursor: pointer; border: 1px solid rgba(240,246,252,0.1); font-weight: bold; padding: 12px 30px; font-size: 16px; border-radius: 6px; margin-top: 20px; transition: 0.2s; box-shadow: 0 0 15px rgba(35,134,54,0.3); }
        .btn-capture:hover { background-color: #2ea043; box-shadow: 0 0 20px rgba(46,160,67,0.6); }
        .status-msg { font-size: 14px; color: #3fb950; margin-top: 10px; height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <img src="https://lh3.googleusercontent.com/d/1DlsLtw43ZhgFrmvjS6ySFH4EmSwuS0tk" alt="Hospital Logo" class="hospital-logo">
            <div class="header-text">
                <h2 class="header-title">VENTILATOR GRAPHICS SIMULATOR</h2>
                <div class="subtitle">Advanced Clinical & Asynchrony Module | พัฒนาโดย นายปฏิยุทธ์ อุปพงษ์</div>
            </div>
        </div>
        
        <div class="main-display">
            <div class="clinical-panel">
                <div class="clinical-title">Patient Monitor</div>
                
                <div class="bed-scene">
                    <video id="patientVideo" src="" class="patient-video" autoplay loop muted playsinline></video>
                    <div id="ventScreen" class="vent-screen-light"></div>
                </div>

                <div class="status-box">
                    <p style="color:#8b949e; font-size: 12px; margin-bottom: 4px;">PHASE</p>
                    <p><span id="breathPhaseBadge" class="badge" style="background:#30363d; color:#c9d1d9;">Wait</span></p>
                    <p style="color:#8b949e; font-size: 12px; margin-top: 10px; margin-bottom: 4px;">CLINICAL ALARM</p>
                    <p><span id="clinicalStatusText" style="font-weight:bold; color:#3fb950; font-size: 14px;">NORMAL (Synchronized)</span></p>
                </div>
            </div>

            <canvas id="ventCanvas" width="850" height="380"></canvas>
        </div>

        <div class="control-panel">
            <div class="control-group" style="align-items: flex-start;">
                <label>Mode</label>
                <select id="modeSelect" onchange="switchPatientVideo()">
                    <option value="cmv">CMV (Volume)</option>
                    <option value="pcv">PCV (Pressure)</option>
                    <option value="psv">PSV (Support)</option>
                </select>
                <label style="margin-top: 10px;">Flow Pattern</label>
                <select id="flowSelect" onchange="switchPatientVideo()">
                    <option value="square">Square</option>
                    <option value="decel">Decelerating</option>
                    <option value="sine">Sine Wave</option>
                </select>
            </div>

            <div class="control-group" style="align-items: flex-start; flex: 1 1 200px;">
                <label>Asynchrony & Alarms</label>
                <select id="abnormalSelect" onchange="switchPatientVideo()">
                    <option value="normal">None (Normal)</option>
                    <option value="autopeep">Auto-PEEP (ลมค้าง)</option>
                    <option value="scoop_mild">Mild Effort (หิวอากาศ)</option>
                    <option value="scoop_severe">Severe Air Hunger</option>
                    <option value="double_trigger">Double Trigger (PCV/CMV)</option>
                    <option value="premature_cycle">Premature Cycling (ตัดก่อน)</option>
                    <option value="trigger_fail">Trigger Failure (PSV)</option>
                    <option value="delay_cycle">Delayed Cycling (ตัดช้า/PSV)</option>
                    <option value="prolong">Prolonged Ti</option>
                </select>
            </div>

            <div class="control-group">
                <label>Resp Rate (RR)</label>
                <div class="digital-value" id="rrVal">15</div>
                <input type="range" id="rrSlider" min="10" max="35" value="15" oninput="document.getElementById('rrVal').innerText = this.value;">
            </div>

            <div class="control-group">
                <label>Insp Time (Ti) <span id="ieRatio" style="color:#58a6ff; font-size: 10px; float: right; margin-top: 2px;">1:3.0</span></label>
                <div class="digital-value" id="tiVal">1.0</div>
                <input type="range" id="tiSlider" min="0.5" max="3.0" step="0.1" value="1.0" oninput="document.getElementById('tiVal').innerText = parseFloat(this.value).toFixed(1)">
            </div>

            <div class="control-group">
                <label>Pressure / Vol</label>
                <div class="digital-value" id="piVal">15</div>
                <input type="range" id="piSlider" min="5" max="30" value="15" oninput="document.getElementById('piVal').innerText = this.value">
            </div>

            <div class="control-group">
                <label>Rise Time</label>
                <div class="digital-value" id="slopeVal">0</div>
                <input type="range" id="slopeSlider" min="0" max="10" value="0" oninput="document.getElementById('slopeVal').innerText = this.value">
            </div>
        </div>

        <button class="btn-capture" onclick="saveGraph()">📸 CAPTURE GRAPH</button>
        <div id="saveStatus" class="status-msg"></div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycby9YYAVfbZLip1-E2Ua_GiwJlmD9tpLhEeZfrT2sxGf4QDFA937oPF60C9vC9PncHDl/exec"; 

        const patientVideos = {
            'normal': 'Rest.mp4',
            'scoop_mild': 'Respi.mp4',
            'scoop_severe': 'Airhunger.mp4',
            'autopeep': 'Respi.mp4',
            'prolong': 'Respi.mp4',
            'double_trigger': 'Respi.mp4', 
            'premature_cycle': 'Respi.mp4',
            'trigger_fail': 'Rest.mp4',
            'delay_cycle': 'Respi.mp4',
            'over_assist': 'Rest.mp4'
        };

        function switchPatientVideo() {
            const mode = document.getElementById('modeSelect').value;
            const flowType = document.getElementById('flowSelect').value;
            const abnormalState = document.getElementById('abnormalSelect').value;
            const videoEl = document.getElementById('patientVideo');
            
            let videoKey = abnormalState;

            if (abnormalState === 'normal') {
                if (mode === 'pcv' && flowType === 'sine') videoKey = 'scoop_mild'; 
                else if (mode === 'psv' && flowType === 'decel') videoKey = 'over_assist'; 
            }
            
            let targetSrc = patientVideos[videoKey];
            if (targetSrc && !videoEl.src.endsWith(targetSrc)) {
                videoEl.src = targetSrc;
                videoEl.play().catch(e => {});
            }
        }

        async function fetchSettingsFromGAS() {
            try {
                const response = await fetch(GAS_API_URL);
                const data = await response.json();
                if(data.status === "success") {
                    document.getElementById('modeSelect').value = data.defaultSettings.mode;
                    document.getElementById('flowSelect').value = data.defaultSettings.flowType;
                    document.getElementById('rrSlider').value = data.defaultSettings.rr;
                    document.getElementById('rrVal').innerText = data.defaultSettings.rr;
                    document.getElementById('tiSlider').value = data.defaultSettings.ti;
                    document.getElementById('tiVal').innerText = parseFloat(data.defaultSettings.ti).toFixed(1);
                    document.getElementById('piSlider').value = data.defaultSettings.pi;
                    document.getElementById('piVal').innerText = data.defaultSettings.pi;
                    document.getElementById('slopeSlider').value = data.defaultSettings.slope;
                    document.getElementById('slopeVal').innerText = data.defaultSettings.slope;
                }
            } catch (error) { console.error("Offline Mode"); } 
            finally { switchPatientVideo(); }
        }

        window.onload = fetchSettingsFromGAS;

        const canvas = document.getElementById('ventCanvas');
        const ctx = canvas.getContext('2d');
        let t = 0; const PIXELS_PER_SECOND = 80;

        function drawWaveform() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const mode = document.getElementById('modeSelect').value;
            const flowType = document.getElementById('flowSelect').value;
            const abnormal = document.getElementById('abnormalSelect').value;
            const rr = parseInt(document.getElementById('rrSlider').value);
            const pi = parseInt(document.getElementById('piSlider').value);
            const slope = parseInt(document.getElementById('slopeSlider').value);
            let tiSetting = parseFloat(document.getElementById('tiSlider').value);

            const cycleTimeSec = 60 / rr; 
            const cycleLength = cycleTimeSec * PIXELS_PER_SECOND; 
            if(tiSetting >= cycleTimeSec - 0.2) tiSetting = cycleTimeSec - 0.2;
            const tiLength = tiSetting * PIXELS_PER_SECOND; 
            
            const teTimeSec = cycleTimeSec - tiSetting;
            document.getElementById('ieRatio').innerText = "I:E 1:" + (teTimeSec / tiSetting).toFixed(1);

            const amplitude = pi * 3.5; 

            // วาด Grid แบบ Ventilator
            ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }
            
            // Baseline 
            ctx.strokeStyle = '#8b949e'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(0, 140); ctx.lineTo(canvas.width, 140); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 290); ctx.lineTo(canvas.width, 290); ctx.stroke();
            ctx.setLineDash([]);

            ctx.lineWidth = 3;
            ctx.beginPath(); const pressPath = new Path2D();
            ctx.beginPath(); const flowPath = new Path2D();
            
            let xOffset = t % (canvas.width + 100);

            for(let x = 0; x < canvas.width; x++) {
                let time = ((x - xOffset + canvas.width + 100) % cycleLength);
                let p_y = 140; let f_y = 290; 
                let isInsp = false;

                // --- ตรรกะแยกกราฟเข้า/ออก ---
                
                // 1. Double Trigger (ซ้อนจังหวะที่ 2)
                let isDoubleTriggerBreath = false;
                if (abnormal === 'double_trigger') {
                    let dtStart = tiLength + 10; 
                    let dtEnd = dtStart + tiLength * 0.9;
                    if (time >= dtStart && time < dtEnd) {
                        isInsp = true; isDoubleTriggerBreath = true;
                        let fakeTime = time - dtStart;
                        p_y = 140 - (fakeTime / tiLength) * amplitude - 15; // กดลึกขึ้นเพราะปอดตึง
                        f_y = 290 - 60; // ไหลเข้าอีก
                    }
                }

                if (time < tiLength && !isDoubleTriggerBreath) { 
                    isInsp = true;
                    if(mode === 'psv' && time < 8) p_y += 12; // Trigger dip

                    if(mode === 'cmv') { p_y = 140 - (time / tiLength) * amplitude; } 
                    else { 
                        let currentRise = Math.min(time / (slope * 8 + 0.1), 1); 
                        p_y = 140 - (amplitude * currentRise); 
                    }

                    if (flowType === 'square') f_y = 290 - 70; 
                    else if (flowType === 'decel') f_y = 290 - 70 * Math.exp(-time/30); 
                    else if (flowType === 'sine') f_y = 290 - Math.sin((time / tiLength) * Math.PI) * 70; 

                    if(abnormal === 'scoop_mild') p_y += Math.sin(time * 0.08) * 18;
                    if(abnormal === 'scoop_severe') p_y += Math.sin(time * 0.08) * 45;

                    // Premature Cycling (ตัดก่อน แต่คนไข้ยังสูด)
                    if(abnormal === 'premature_cycle' && time > tiLength * 0.7) {
                        isInsp = false; // เครื่องตัดเป็นหายใจออก
                        p_y += 25; // Pressure ตกวูบ
                        f_y -= 15; // Flow พยายามตีกลับ
                    }
                    
                    // Delayed Cycling (เครื่องแช่นาน คนไข้เริ่มดันออก)
                    if(abnormal === 'delay_cycle' && time > tiLength - 25) {
                        p_y -= 25; // Pressure Spike ขึ้น
                        f_y = 290 + 20; // Flow ตีกลับเป็นบวก
                    }

                } else if (!isDoubleTriggerBreath) {
                    // ช่วงหายใจออกปกติ
                    let expTime = time - tiLength;
                    p_y = 140 - amplitude * Math.exp(-expTime/15);
                    
                    // ปรับ Auto-PEEP ให้ Expiratory decay ค่อยๆไต่ขึ้นและถูกตัดจบชน Baseline ไม่ทัน
                    if(abnormal === 'autopeep') {
                        f_y = 290 + 75 * Math.exp(-expTime/65); // ตัวหาร 65 ทำให้ไต่ช้ามาก
                    } else {
                        f_y = 290 + 75 * Math.exp(-expTime/20); // ปกติ
                    }

                    // Trigger Failure (ออกแรงในจังหวะออก แต่เครื่องไม่ตอบ)
                    if(abnormal === 'trigger_fail' && time > cycleLength - 35 && time < cycleLength - 15) {
                        let effortT = time - (cycleLength - 35);
                        p_y += 10 * Math.sin(effortT * Math.PI / 20); // กราฟ Paw ตกเล็กน้อย
                        f_y -= 15 * Math.sin(effortT * Math.PI / 20); // กราฟ Flow ตีขึ้นนิดๆ
                    }

                    if(abnormal === 'prolong' && time < tiLength + 20) { p_y -= 15; }
                }

                if(x === 0) { pressPath.moveTo(x, p_y); flowPath.moveTo(x, f_y); }
                else { pressPath.lineTo(x, p_y); flowPath.lineTo(x, f_y); }
            }

            // สีเส้นกราฟเรืองแสง
            ctx.strokeStyle = '#d2a8ff'; ctx.shadowBlur = 4; ctx.shadowColor = '#d2a8ff'; ctx.stroke(pressPath); 
            ctx.strokeStyle = '#3fb950'; ctx.shadowBlur = 4; ctx.shadowColor = '#3fb950'; ctx.stroke(flowPath);  
            ctx.shadowBlur = 0; // reset
            
            ctx.fillStyle = '#d2a8ff'; ctx.font = '14px monospace'; ctx.fillText('Paw (cmH2O)', 10, 25);
            ctx.fillStyle = '#3fb950'; ctx.fillText('Flow (L/min)', 10, 175);

            // อัปเดต UI 
            let rightEdgeTime = ((canvas.width - 1 - xOffset + canvas.width + 100) % cycleLength);
            let phase = rightEdgeTime < tiLength ? 'Insp' : 'Exp';
            
            let ventScreen = document.getElementById('ventScreen');
            let phaseBadge = document.getElementById('breathPhaseBadge');
            let statusTextEl = document.getElementById('clinicalStatusText');

            if (phase === 'Insp') {
                ventScreen.style.background = '#3fb950'; ventScreen.style.boxShadow = '0 0 15px #3fb950';
                phaseBadge.innerText = 'INSPIRATION'; phaseBadge.style.background = '#3fb950'; phaseBadge.style.color = '#000';
            } else {
                ventScreen.style.background = '#161b22'; ventScreen.style.boxShadow = 'none';
                phaseBadge.innerText = 'EXHALATION'; phaseBadge.style.background = '#30363d'; phaseBadge.style.color = '#c9d1d9';
            }

            // ระบบ Alarm แจ้งเตือน Asynchrony
            let txt = "NORMAL (Synchronized)"; let col = "#3fb950";
            
            if (abnormal === 'autopeep') { txt = "⚠️ ALARM: Auto-PEEP Detected"; col = "#ff7b72"; }
            else if (abnormal === 'scoop_mild') { txt = "⚠️ ALARM: Active Effort (Flow Starvation)"; col = "#d2a8ff"; }
            else if (abnormal === 'scoop_severe') { txt = "🚨 ALARM: Severe Air Hunger"; col = "#ff7b72"; }
            else if (abnormal === 'double_trigger') { txt = "🚨 ALARM: Double Triggering"; col = "#ff7b72"; }
            else if (abnormal === 'premature_cycle') { txt = "⚠️ ALARM: Premature Cycling"; col = "#ffa657"; }
            else if (abnormal === 'trigger_fail') { txt = "⚠️ ALARM: Ineffective Triggering"; col = "#ffa657"; }
            else if (abnormal === 'delay_cycle') { txt = "⚠️ ALARM: Delayed Cycling"; col = "#ffa657"; }
            else if (abnormal === 'prolong') { txt = "⚠️ ALARM: Active Exhalation"; col = "#d2a8ff"; }
            else {
                if (mode === 'pcv' && flowType === 'sine') { txt = "⚠️ CHECK: Possible Active Effort"; col = "#ffa657"; } 
                else if (mode === 'psv' && flowType === 'decel') { txt = "⚠️ CHECK: Possible Over-assistance"; col = "#ffa657"; }
            }
            
            statusTextEl.innerText = txt; statusTextEl.style.color = col;

            t -= 2; requestAnimationFrame(drawWaveform);
        }

        drawWaveform();

        function saveGraph() {
            const link = document.createElement('a'); link.download = 'vent_advanced_sim.png'; link.href = canvas.toDataURL('image/png'); link.click();
            document.getElementById('saveStatus').innerText = "✅ Captured!";
            setTimeout(() => { document.getElementById('saveStatus').innerText = ""; }, 3000);
        }
    </script>
</body>
</html>
